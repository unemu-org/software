# SPDX-License-Identifier: AGPL-3.0-or-later
#
# The checks of every pull request and every push to main, and a weekly cold
# run: the README's check command; upcli's check of every recipe, which
# refuses drift and drafts too; each recipe the change touches
# (lib/changed.py) built against its lock from downloads, then built again
# from those inputs alone by upcli's conformance run; and, when its inputs
# change and every week, the script that makes the FreeDOS source archive.
# No secrets, no environment, no registry read or write: fork pull requests
# run all of it. See docs/publishing.md.

name: check

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Mondays: every recipe and script, cold (no download cache), to catch
    # vanished mirrors and host drift.
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A pull request's newest run replaces its older one. Every other run has a
# group of its own commit, so a push to main never cancels another.
concurrency:
  group: check-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: tests and selection
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        # Every step in the pinned devShell.
        shell: nix develop --command bash -euo pipefail {0}
    outputs:
      recipes: ${{ steps.select.outputs.recipes }}
      sources: ${{ steps.select.outputs.sources }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, so lib/changed.py can compare any two commits.
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5

      - name: The README's check command
        run: |
          shellcheck -x lib/source.sh tests/*.sh recipes/*/*/source/build.sh
          bash tests/source-selftest.sh
          for test in tests/*_test.py; do
            python3 -I "$test"
          done

      - name: Select the recipes and scripts
        id: select
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) range=("$PR_BASE" HEAD) ;;
            push) range=("$BEFORE" HEAD) ;;
            *) range=(--all) ;;
          esac
          # Private recipes get the static check below, never a build or conformance.
          recipes="$(python3 -I lib/changed.py --json --open-only "${range[@]}")"
          sources="$(python3 -I lib/changed.py --json --sources "${range[@]}")"
          echo "recipes: $recipes"
          echo "scripts: $sources"
          echo "recipes=$recipes" >> "$GITHUB_OUTPUT"
          echo "sources=$sources" >> "$GITHUB_OUTPUT"

  recipes:
    name: recipes
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        # The runner's own bash and Python: upcli builds the recipes, and
        # nothing of them needs Nix.
        shell: bash -euo pipefail {0}
    env:
      SELECTION: ${{ needs.tests.outputs.recipes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python 3.11 or later
        run: |
          python3 -I -c 'import sys; sys.exit(0 if sys.version_info >= (3, 11) else
            "lib/ needs Python 3.11 or later (tomllib); this runner has " + sys.version.split()[0])'

      - name: Fetch the pinned upcli
        run: python3 -I lib/upcli.py fetch "$RUNNER_TEMP/upcli"

      # Every recipe, including private ones, whatever the build selection:
      # a finding, drift (a work file
      # that differs from a lock) or a draft fails the check.
      - name: Check every recipe
        run: python3 -I lib/recipes.py check --cli "$RUNNER_TEMP/upcli/upcli"

      # Downloads only, by SHA-256; upcli checks every input it takes from
      # here against its pin, so the cache never decides a byte. The weekly
      # run goes without it.
      - name: Download cache
        if: env.SELECTION != '[]' && github.event_name != 'schedule'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: inputs
          key: inputs-${{ hashFiles('recipes/**/*.media.toml', 'recipes/**/*.firmware.toml') }}
          restore-keys: inputs-

      # Each selected recipe built into a fresh store: upcli downloads what
      # is missing from the URLs its recipe pins, builds every byte and
      # compares it with the lock; then the show, the guard's dry run and
      # the digest pin (lib/publish.py's dry run, which reads no registry).
      - name: Build the selected recipes against their locks
        if: env.SELECTION != '[]'
        run: |
          python3 -I -c 'import json, sys; print(end="".join(s + "\0" for s in json.loads(sys.argv[1])))' \
            "$SELECTION" > "$RUNNER_TEMP/selection"
          mapfile -d '' -t recipes < "$RUNNER_TEMP/selection"
          [ "${#recipes[@]}" -gt 0 ]
          # Every cached file is named by its SHA-256; one whose bytes are
          # not that is dropped, so the cache never keeps it.
          prune() {
            local file
            for file in inputs/*; do
              [ -e "$file" ] || continue
              if [ -L "$file" ] || [ ! -f "$file" ] \
                || [ "$(sha256sum < "$file" | cut -d' ' -f1)" != "$(basename -- "$file")" ]; then
                echo "dropped $file: not the file its name pins"
                rm -f -- "$file"
              fi
            done
          }
          mkdir -p inputs
          prune
          status=0
          python3 -I lib/publish.py --cli "$RUNNER_TEMP/upcli/upcli" --fetch --library inputs \
            --store "$RUNNER_TEMP/store-1" -- "${recipes[@]}" > "$RUNNER_TEMP/summary.txt" || status=$?
          cat "$RUNNER_TEMP/summary.txt"
          {
            echo "### Dry run"
            echo '```'
            cat "$RUNNER_TEMP/summary.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -d "$RUNNER_TEMP/store-1/cache/downloads" ]; then
            find "$RUNNER_TEMP/store-1/cache/downloads" -maxdepth 1 -type f -name '[0-9a-f]*' \
              -exec cp -f -t inputs/ {} +
          fi
          prune
          exit "$status"

      # The same recipes built again in a scratch store, from the inputs
      # alone (no download, nothing found instead of made): every step runs
      # again and must give the pinned digest.
      - name: Build them again from the inputs alone
        if: env.SELECTION != '[]'
        run: |
          mapfile -d '' -t recipes < "$RUNNER_TEMP/selection"
          mkdir "$RUNNER_TEMP/home"
          HOME="$RUNNER_TEMP/home" LC_ALL=C TZ=UTC "$RUNNER_TEMP/upcli/upcli" recipe conformance \
            "${recipes[@]}" --library inputs --store "$RUNNER_TEMP/store-2"

  source:
    name: prepared inputs
    needs: tests
    if: needs.tests.outputs.sources != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        # The scripts run in the pinned devShell.
        shell: nix develop --command bash -euo pipefail {0}
    env:
      SCRIPTS: ${{ needs.tests.outputs.sources }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5

      # The scripts check every cached file against its pin.
      - name: Download cache
        if: github.event_name != 'schedule'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cache
          key: sources-${{ hashFiles('recipes/**/source/**', 'lib/source.sh', 'flake.lock') }}

      # Each script builds its input from scratch and stops unless the
      # result has its pin, the recipes' pin.
      - name: Make the prepared inputs
        run: |
          python3 -I -c 'import json, sys; print(end="".join(s + "\0" for s in json.loads(sys.argv[1])))' \
            "$SCRIPTS" > "$RUNNER_TEMP/scripts"
          mapfile -d '' -t scripts < "$RUNNER_TEMP/scripts"
          rm -rf -- out build
          for script in "${scripts[@]}"; do
            bash "$script"
          done

      - name: Fetch the pinned upcli
        run: python3 -I lib/upcli.py fetch "$RUNNER_TEMP/upcli"

      # The recipes beside each script, built with what the script made (a
      # library, found before any URL): the asset the recipes download is
      # the archive the script makes.
      - name: Build the recipes from the prepared inputs
        run: |
          mapfile -d '' -t scripts < "$RUNNER_TEMP/scripts"
          folders=()
          for script in "${scripts[@]}"; do
            folders+=("$(dirname -- "$(dirname -- "$script")")")
          done
          python3 -I lib/publish.py --cli "$RUNNER_TEMP/upcli/upcli" --fetch --library out -- "${folders[@]}"

  # One status to require: every job above passed, or was not needed.
  result:
    name: check result
    needs: [tests, recipes, source]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        shell: bash
        env:
          TESTS: ${{ needs.tests.result }}
          RECIPES: ${{ needs.recipes.result }}
          SOURCE: ${{ needs.source.result }}
        run: |
          echo "tests: $TESTS, recipes: $RECIPES, prepared inputs: $SOURCE"
          [ "$TESTS" = success ] && [ "$RECIPES" = success ] \
            && { [ "$SOURCE" = success ] || [ "$SOURCE" = skipped ]; }
