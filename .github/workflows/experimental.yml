# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Every push to main: the recipes it touches (lib/changed.py), built and
# checked, and their sets and packages pushed to
# <host>/unemu/experimental/<kind>/<name>:<tag>.ci<run id>, for testing
# before publication. What unemu/media/ or unemu/firmware/ already serves
# under its own tag is skipped: never rebuilt, never pushed again. Two jobs:
# the recipes run in the build job, which has no environment and no secret;
# the push job, on a fresh runner with the credentials, runs no recipe code
# and takes the outputs as an artifact, checked against their pins. See
# docs/publishing.md.

name: experimental

on:
  push:
    branches: [main]
  # Every recipe; still only what is not published yet.
  workflow_dispatch:

permissions:
  contents: read

# One experimental publication at a time; a run waits for the one before.
concurrency:
  group: experimental
  cancel-in-progress: false

jobs:
  build:
    name: build and check (no credentials)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        # Every step in the pinned devShell.
        shell: nix develop --command bash -euo pipefail {0}
    outputs:
      # The selected recipes, as one JSON list.
      selection: ${{ steps.select.outputs.selection }}
      # Whether anything was built, so there is something to push.
      any: ${{ steps.built.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, so lib/changed.py can compare the push.
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5

      - name: Select the recipes
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = push ]; then
            selection="$(python3 -I lib/changed.py --json "$BEFORE" HEAD)"
          else
            selection="$(python3 -I lib/changed.py --json --all)"
          fi
          echo "selected: $selection"
          echo "selection=$selection" >> "$GITHUB_OUTPUT"

      - name: Fetch the pinned upcli
        if: steps.select.outputs.selection != '[]'
        run: python3 -I lib/upcli.py fetch "$RUNNER_TEMP/upcli"

      # Published sets and packages are not built; unpinned ones fail the run.
      - name: Build and check
        if: steps.select.outputs.selection != '[]'
        env:
          UNEMU_REGISTRY_HOST: ${{ vars.UNEMU_REGISTRY_HOST }}
          RUN_ID: ${{ github.run_id }}
          SELECTION: ${{ steps.select.outputs.selection }}
        run: |
          python3 -I -c 'import json, sys; print(end="".join(s + "\0" for s in json.loads(sys.argv[1])))' \
            "$SELECTION" > "$RUNNER_TEMP/selection"
          mapfile -d '' -t recipes < "$RUNNER_TEMP/selection"
          [ "${#recipes[@]}" -gt 0 ]
          status=0
          python3 -I lib/publish.py --cli "$RUNNER_TEMP/upcli/upcli" --skip-published \
            --experimental "$RUN_ID" -- "${recipes[@]}" > "$RUNNER_TEMP/dry-run.txt" || status=$?
          cat "$RUNNER_TEMP/dry-run.txt"
          {
            echo "### Dry run"
            echo '```'
            cat "$RUNNER_TEMP/dry-run.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # On a fresh runner out/ holds only what this run built: the recipes
      # with something left to push.
      - name: What to push
        id: built
        run: |
          shopt -s nullglob
          built=(out/*/)
          if [ "${#built[@]}" -gt 0 ]; then
            echo "built: ${built[*]}"
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "nothing built, nothing to push"
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Hand the outputs to the push job
        if: steps.built.outputs.any == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: outputs
          path: out/
          retention-days: 1
          if-no-files-found: error
          overwrite: true

  push:
    name: push to unemu/experimental/
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Holds UNEMU_EXPERIMENTAL_PASSWORD; deploys from main only.
    environment: experimental
    defaults:
      run:
        # The runner's own bash, Python and curl: no Nix in this job.
        shell: bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python 3.11 or later
        run: |
          python3 -I -c 'import sys; sys.exit(0 if sys.version_info >= (3, 11) else
            "lib/publish.py needs Python 3.11 or later (tomllib); this runner has " + sys.version.split()[0])'

      # Fetched and checked here again, never taken from the artifact.
      - name: Fetch the pinned upcli
        run: python3 -I lib/upcli.py fetch "$RUNNER_TEMP/upcli"

      - name: Take the outputs of the build job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: outputs
          path: out

      # No recipe code runs here: --no-build checks every pinned output's
      # SHA-256 before the import.
      - name: Push to unemu/experimental/
        env:
          UNEMU_REGISTRY_HOST: ${{ vars.UNEMU_REGISTRY_HOST }}
          UNEMU_REGISTRY_USER: ci-experimental
          UNEMU_REGISTRY_PASSWORD: ${{ secrets.UNEMU_EXPERIMENTAL_PASSWORD }}
          RUN_ID: ${{ github.run_id }}
          SELECTION: ${{ needs.build.outputs.selection }}
        run: |
          python3 -I -c 'import json, sys; print(end="".join(s + "\0" for s in json.loads(sys.argv[1])))' \
            "$SELECTION" > "$RUNNER_TEMP/selection"
          mapfile -d '' -t recipes < "$RUNNER_TEMP/selection"
          [ "${#recipes[@]}" -gt 0 ]
          status=0
          python3 -I lib/publish.py --cli "$RUNNER_TEMP/upcli/upcli" --skip-published --no-build --push \
            --experimental "$RUN_ID" -- "${recipes[@]}" > "$RUNNER_TEMP/push.txt" || status=$?
          cat "$RUNNER_TEMP/push.txt"
          {
            echo "### Push"
            echo '```'
            cat "$RUNNER_TEMP/push.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
