# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Every push to main: the recipes it touches (lib/changed.py), built against
# their locks and checked, and their sets and packages pushed to
# <host>/unemu/experimental/<kind>/ibm-pc/<name>:<release>-ci<run id>-rN
# (a set with its alias <release>-ci<run id>, a package as ci<run id>-rN),
# for testing before publication. What unemu/media/ or unemu/firmware/
# already serves under its own tag (and a set's alias) is skipped: never
# rebuilt, never pushed again; an official tag that serves another digest is
# noted and does not stop the experimental push. Two jobs: the build job has
# no environment and no secret, builds, and hands the built store on; the
# push job, on a fresh runner, builds and downloads nothing: it checks every
# byte of that store against the recipes' pins and pushes it. See
# docs/publishing.md.

name: experimental

on:
  push:
    branches: [main]
  # Every open recipe; still only what is not published yet.
  workflow_dispatch:

permissions:
  contents: read

# One experimental publication at a time; a run waits for the one before.
concurrency:
  group: experimental
  cancel-in-progress: false

defaults:
  run:
    # The runner's own bash, Python and curl: no Nix in this workflow.
    shell: bash -euo pipefail {0}

jobs:
  build:
    name: build and check (no credentials)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      # The selected recipes, as one JSON list.
      selection: ${{ steps.select.outputs.selection }}
      # Whether anything is left to push.
      any: ${{ steps.built.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, so lib/changed.py can compare the push.
          fetch-depth: 0
          persist-credentials: false

      - name: Python 3.11 or later
        run: |
          python3 -I -c 'import sys; sys.exit(0 if sys.version_info >= (3, 11) else
            "lib/ needs Python 3.11 or later (tomllib); this runner has " + sys.version.split()[0])'

      - name: Select the recipes
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = push ]; then
            selection="$(python3 -I lib/changed.py --json --open-only "$BEFORE" HEAD)"
          else
            selection="$(python3 -I lib/changed.py --json --open-only --all)"
          fi
          echo "selected: $selection"
          echo "selection=$selection" >> "$GITHUB_OUTPUT"

      - name: Fetch the pinned upcli
        if: steps.select.outputs.selection != '[]'
        run: python3 -I lib/upcli.py fetch "$RUNNER_TEMP/upcli"

      # Published sets and packages are not built; drafts fail the run.
      - name: Build and check
        if: steps.select.outputs.selection != '[]'
        env:
          UNEMU_REGISTRY_HOST: ${{ vars.UNEMU_REGISTRY_HOST }}
          RUN_ID: ${{ github.run_id }}
          SELECTION: ${{ steps.select.outputs.selection }}
        run: |
          python3 -I -c 'import json, sys; print(end="".join(s + "\0" for s in json.loads(sys.argv[1])))' \
            "$SELECTION" > "$RUNNER_TEMP/selection"
          mapfile -d '' -t recipes < "$RUNNER_TEMP/selection"
          [ "${#recipes[@]}" -gt 0 ]
          status=0
          python3 -I lib/publish.py --cli "$RUNNER_TEMP/upcli/upcli" --skip-published \
            --experimental "$RUN_ID" --fetch --store "$RUNNER_TEMP/store" --report "$RUNNER_TEMP/report.json" \
            -- "${recipes[@]}" > "$RUNNER_TEMP/dry-run.txt" || status=$?
          cat "$RUNNER_TEMP/dry-run.txt"
          {
            echo "### Dry run"
            echo '```'
            cat "$RUNNER_TEMP/dry-run.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # The built store's OCI layout and its store.toml (not its download
      # cache), with the dry run's table: the push job pushes from it.
      # Nothing to push when every selected one is published.
      - name: What to push
        id: built
        env:
          SELECTION: ${{ steps.select.outputs.selection }}
        run: |
          if [ "$SELECTION" = '[]' ]; then
            echo "nothing selected, nothing to push"
            echo "any=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          any="$(python3 -I -c 'import json, sys
          rows = json.load(open(sys.argv[1]))
          print("true" if any(r["outcome"] == "dry run" for r in rows) else "false")' "$RUNNER_TEMP/report.json")"
          echo "any=$any" >> "$GITHUB_OUTPUT"
          echo "to push: $any"
          if [ "$any" = true ]; then
            mkdir -p handover/store
            cp -R "$RUNNER_TEMP/store/images" "$RUNNER_TEMP/store/store.toml" handover/store/
            cp "$RUNNER_TEMP/dry-run.txt" "$RUNNER_TEMP/report.json" handover/
          fi

      - name: Hand the store to the push job
        if: steps.built.outputs.any == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store
          path: handover/
          retention-days: 1
          if-no-files-found: error
          overwrite: true

  # Builds nothing and downloads nothing but the pinned upcli and the built
  # store: the credentials of this job never meet a build.
  push:
    name: push to unemu/experimental/
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Holds UNEMU_EXPERIMENTAL_PASSWORD; deploys from main only.
    environment: experimental
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python 3.11 or later
        run: |
          python3 -I -c 'import sys; sys.exit(0 if sys.version_info >= (3, 11) else
            "lib/ needs Python 3.11 or later (tomllib); this runner has " + sys.version.split()[0])'

      # Fetched and checked here again, never taken from the artifact.
      - name: Fetch the pinned upcli
        run: python3 -I lib/upcli.py fetch "$RUNNER_TEMP/upcli"

      - name: Take the store of the build job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: store
          path: handover

      # --no-build: every byte the push uploads is checked against the
      # recipe's pin and copied into a clean store of the run's own, the
      # only one upcli reads (lib/publish.py, take_from_store); upcli never
      # reads a file of the artifact, and a forged store can only fail.
      - name: Push to unemu/experimental/
        env:
          UNEMU_REGISTRY_HOST: ${{ vars.UNEMU_REGISTRY_HOST }}
          UNEMU_REGISTRY_USER: ci-experimental
          UNEMU_REGISTRY_PASSWORD: ${{ secrets.UNEMU_EXPERIMENTAL_PASSWORD }}
          RUN_ID: ${{ github.run_id }}
          SELECTION: ${{ needs.build.outputs.selection }}
        run: |
          python3 -I -c 'import json, sys; print(end="".join(s + "\0" for s in json.loads(sys.argv[1])))' \
            "$SELECTION" > "$RUNNER_TEMP/selection"
          mapfile -d '' -t recipes < "$RUNNER_TEMP/selection"
          [ "${#recipes[@]}" -gt 0 ]
          status=0
          python3 -I lib/publish.py --cli "$RUNNER_TEMP/upcli/upcli" --skip-published --no-build \
            --store handover/store --push --experimental "$RUN_ID" -- "${recipes[@]}" \
            > "$RUNNER_TEMP/push.txt" || status=$?
          cat "$RUNNER_TEMP/push.txt"
          {
            echo "### Push"
            echo '```'
            cat "$RUNNER_TEMP/push.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
