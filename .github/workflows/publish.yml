# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Publication to <host>/unemu/media/ and <host>/unemu/firmware/, started by
# hand. Only the sets and packages whose own tag (or a set's release alias)
# is not on the registry yet are built and pushed; everything already
# published is skipped, never rebuilt or pushed again. Two jobs: the build
# job has no environment and no secret, builds, puts its dry-run table in
# the run's summary before the maintainer approves the push job
# (environment media), and hands the built store on. The push job, on a
# fresh runner, builds and downloads nothing: it reads the selection from
# the input itself, checks every byte of that store against the recipes'
# pins and pushes it. See docs/publishing.md.

name: publish

on:
  workflow_dispatch:
    inputs:
      select:
        description: >-
          Recipe files, folders of recipes or refs to publish, separated by spaces
          (recipes/media/freedos, unemu/media/ibm-pc/<work>:<release>-rN, which pushes its alias
          <release> too, unemu/firmware/ibm-pc/<id>:rN); empty: every recipe. Published ones are
          skipped.
        type: string
        required: false
        default: ""

permissions:
  contents: read

# One publication at a time; a run waits for the one before.
concurrency:
  group: publish
  cancel-in-progress: false

defaults:
  run:
    # The runner's own bash, Python and curl: no Nix in this workflow.
    shell: bash -euo pipefail {0}

jobs:
  build:
    name: build and check (no credentials)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      # Whether anything is left to push. The push job reads the selection
      # from the input itself.
      any: ${{ steps.built.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python 3.11 or later
        run: |
          python3 -I -c 'import sys; sys.exit(0 if sys.version_info >= (3, 11) else
            "lib/ needs Python 3.11 or later (tomllib); this runner has " + sys.version.split()[0])'

      # Words separated by spaces; a newline, carriage return or tab is
      # refused rather than guessed at.
      - name: Read the selection
        env:
          SELECT: ${{ inputs.select }}
        run: |
          case "$SELECT" in
            *[$'\n\r\t']*)
              echo "::error::the select input holds a newline, carriage return or tab; separate recipes and refs with spaces"
              exit 1
              ;;
          esac
          read -ra words < <(printf '%s\n' "$SELECT")
          : > "$RUNNER_TEMP/selection"
          for word in ${words[@]+"${words[@]}"}; do
            printf '%s\0' "$word" >> "$RUNNER_TEMP/selection"
          done
          echo "selected: ${words[*]-} (empty: every recipe)"

      - name: Fetch the pinned upcli
        run: python3 -I lib/upcli.py fetch "$RUNNER_TEMP/upcli"

      # Published sets and packages are not built; drafts fail the run.
      - name: Build and check
        env:
          UNEMU_REGISTRY_HOST: ${{ vars.UNEMU_REGISTRY_HOST }}
        run: |
          mapfile -d '' -t selectors < "$RUNNER_TEMP/selection"
          status=0
          python3 -I lib/publish.py --cli "$RUNNER_TEMP/upcli/upcli" --skip-published --fetch \
            --store "$RUNNER_TEMP/store" --report "$RUNNER_TEMP/report.json" \
            -- ${selectors[@]+"${selectors[@]}"} > "$RUNNER_TEMP/dry-run.txt" || status=$?
          cat "$RUNNER_TEMP/dry-run.txt"
          {
            echo "### Dry run"
            echo '```'
            cat "$RUNNER_TEMP/dry-run.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # The built store's OCI layout and its store.toml (not its download
      # cache), with the dry run's table: the push job pushes from it.
      # Nothing to push when every selected one is published.
      - name: What to push
        id: built
        run: |
          any="$(python3 -I -c 'import json, sys
          rows = json.load(open(sys.argv[1]))
          print("true" if any(r["outcome"] == "dry run" for r in rows) else "false")' "$RUNNER_TEMP/report.json")"
          echo "any=$any" >> "$GITHUB_OUTPUT"
          echo "to push: $any"
          if [ "$any" = true ]; then
            mkdir -p handover/store
            cp -R "$RUNNER_TEMP/store/images" "$RUNNER_TEMP/store/store.toml" handover/store/
            cp "$RUNNER_TEMP/dry-run.txt" "$RUNNER_TEMP/report.json" handover/
          fi

      - name: Hand the store to the push job
        if: steps.built.outputs.any == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store
          path: handover/
          # The maintainer approves the push job within this time, or re-runs.
          retention-days: 7
          if-no-files-found: error
          overwrite: true

  # Builds nothing and downloads nothing but the pinned upcli and the built
  # store: the credentials of this job never meet a build.
  push:
    name: push to unemu/media/ and unemu/firmware/
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Holds UNEMU_PROMOTE_PASSWORD; the maintainer approves each run of this
    # job; deploys from main only.
    environment: media
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python 3.11 or later
        run: |
          python3 -I -c 'import sys; sys.exit(0 if sys.version_info >= (3, 11) else
            "lib/ needs Python 3.11 or later (tomllib); this runner has " + sys.version.split()[0])'

      # Fetched and checked here again, never taken from the artifact.
      - name: Fetch the pinned upcli
        run: python3 -I lib/upcli.py fetch "$RUNNER_TEMP/upcli"

      - name: Take the store of the build job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: store
          path: handover

      # From the input, as the build job reads it, never from the build
      # job's outputs (an empty selection would mean every recipe).
      - name: Read the selection
        env:
          SELECT: ${{ inputs.select }}
        run: |
          case "$SELECT" in
            *[$'\n\r\t']*)
              echo "::error::the select input holds a newline, carriage return or tab; separate recipes and refs with spaces"
              exit 1
              ;;
          esac
          read -ra words < <(printf '%s\n' "$SELECT")
          : > "$RUNNER_TEMP/selection"
          for word in ${words[@]+"${words[@]}"}; do
            printf '%s\0' "$word" >> "$RUNNER_TEMP/selection"
          done
          echo "selected: ${words[*]-} (empty: every recipe)"

      # --no-build: every byte the push uploads is checked against the
      # recipe's pin and copied into a clean store of the run's own, the
      # only one upcli reads (lib/publish.py, take_from_store); upcli never
      # reads a file of the artifact, and a forged store can only fail.
      - name: Push to unemu/media/ and unemu/firmware/
        env:
          UNEMU_REGISTRY_HOST: ${{ vars.UNEMU_REGISTRY_HOST }}
          UNEMU_REGISTRY_USER: ci-promote
          UNEMU_REGISTRY_PASSWORD: ${{ secrets.UNEMU_PROMOTE_PASSWORD }}
        run: |
          mapfile -d '' -t selectors < "$RUNNER_TEMP/selection"
          status=0
          python3 -I lib/publish.py --cli "$RUNNER_TEMP/upcli/upcli" --skip-published --no-build \
            --store handover/store --push -- ${selectors[@]+"${selectors[@]}"} \
            > "$RUNNER_TEMP/push.txt" || status=$?
          cat "$RUNNER_TEMP/push.txt"
          {
            echo "### Push"
            echo '```'
            cat "$RUNNER_TEMP/push.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
