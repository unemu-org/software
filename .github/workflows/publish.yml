# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Publication to <host>/unemu/media/, unemu/firmware/ and unemu/recipes/, started by
# hand. Only the sets and packages whose own tag (or a set's release alias)
# is not on the registry yet are built and pushed; everything already
# published is skipped, never rebuilt or pushed again. Two jobs: the build
# job has no environment and no secret, builds, puts its dry-run table in
# the run's summary before the maintainer approves the push job
# (environment media), and hands the built store on. The push job, on a
# fresh runner, installs unemu, takes the built store and reads the
# selection from the input itself, checks every byte of that store against
# the recipes' pins and pushes it. Recipe artifacts are guard-checked in
# build, recreated from the push checkout, gated on published open outputs,
# then pushed and pulled anonymously for byte comparison. See docs/publishing.md.

name: publish

on:
  workflow_dispatch:
    inputs:
      select:
        description: >-
          Recipe files, folders of recipes or refs to publish, separated by spaces
          (recipes/media/freedos, unemu/media/ibm-pc/<work>:<release>-rN, which pushes its alias
          <release> too, unemu/firmware/ibm-pc/<id>:rN); empty: every open recipe
          (recipes mode: every open and private recipe). Published
          outputs are skipped; private paths are allowed only with mode=recipes.
        type: string
        required: false
        default: ""
      mode:
        description: >-
          Artifacts to publish (both: outputs then recipes; outputs alone leaves
          publication incomplete; private recipes require recipes alone)
        type: choice
        options: [outputs, recipes, both]
        required: true
        default: both

permissions:
  contents: read

# One publication at a time; a run waits for the one before.
concurrency:
  group: publish
  cancel-in-progress: false

defaults:
  run:
    # The runner's own bash, Python and curl: no Nix in this workflow.
    shell: bash -euo pipefail {0}

jobs:
  build:
    name: build and check (no credentials)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      # Whether anything is left to push. The push job reads the selection
      # from the input itself.
      any: ${{ steps.built.outputs.any }}
      outputs: ${{ steps.built.outputs.outputs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python 3.11 or later
        run: |
          python3 -I -c 'import sys; sys.exit(0 if sys.version_info >= (3, 11) else
            "lib/ needs Python 3.11 or later (tomllib); this runner has " + sys.version.split()[0])'

      # Words separated by spaces; a newline, carriage return or tab is
      # refused rather than guessed at.
      - name: Read the selection
        env:
          SELECT: ${{ inputs.select }}
          MODE: ${{ inputs.mode }}
        run: |
          case "$SELECT" in
            *[$'\n\r\t']*)
              echo "::error::the select input holds a newline, carriage return or tab; separate recipes and refs with spaces"
              exit 1
              ;;
          esac
          read -ra words < <(printf '%s\n' "$SELECT")
          # Both uses the open default in both jobs; only recipes alone may select private.
          if [ "$MODE" = both ] && [ "${#words[@]}" -eq 0 ]; then
            words=(recipes/media recipes/firmware)
          fi
          : > "$RUNNER_TEMP/selection"
          for word in ${words[@]+"${words[@]}"}; do
            printf '%s\0' "$word" >> "$RUNNER_TEMP/selection"
          done
          echo "selected: ${words[*]-} (empty: mode default)"

      # The action checks the release archive against its SHA256SUMS,
      # then runs unemu --version and checks commit:, not our archive pins.
      - name: Install unemu
        id: unemu
        uses: unemu-org/unemu/.github/actions/setup-unemu@38408cd8669803a4fda1369ba9948e4eedc39539 # v0.0.5
        with:
          version: v0.0.5
          commit: 38408cd8669803a4fda1369ba9948e4eedc39539

      # Published sets and packages are not built; drafts fail the run.
      - name: Build and check
        if: inputs.mode != 'recipes'
        env:
          UNEMU: ${{ steps.unemu.outputs.path }}
          UNEMU_REGISTRY_HOST: ${{ vars.UNEMU_REGISTRY_HOST }}
        run: |
          mapfile -d '' -t selectors < "$RUNNER_TEMP/selection"
          status=0
          python3 -I lib/publish.py --cli "$UNEMU" --skip-published --fetch \
            --store "$RUNNER_TEMP/store" --report "$RUNNER_TEMP/report.json" \
            -- ${selectors[@]+"${selectors[@]}"} > "$RUNNER_TEMP/dry-run.txt" || status=$?
          cat "$RUNNER_TEMP/dry-run.txt"
          {
            echo "### Dry run"
            echo '```'
            cat "$RUNNER_TEMP/dry-run.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # Local guard only: in mode=both the output may still await this run's
      # push. The push job enforces the anonymous output gate after outputs.
      - name: Check recipe artifacts
        if: inputs.mode != 'outputs'
        env:
          UNEMU: ${{ steps.unemu.outputs.path }}
          UNEMU_REGISTRY_HOST: ${{ vars.UNEMU_REGISTRY_HOST }}
        run: |
          mapfile -d '' -t selectors < "$RUNNER_TEMP/selection"
          status=0
          python3 -I lib/publish.py --cli "$UNEMU" --recipes --guard-only \
            --store "$RUNNER_TEMP/recipe-store" --report "$RUNNER_TEMP/recipes.json" \
            -- ${selectors[@]+"${selectors[@]}"} > "$RUNNER_TEMP/recipes.txt" || status=$?
          cat "$RUNNER_TEMP/recipes.txt"
          {
            echo "### Recipe guards (output gate runs after output publication)"
            echo '```'
            cat "$RUNNER_TEMP/recipes.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # The built store's OCI layout and its store.toml (not its download
      # cache), with the dry run's table: the push job pushes from it.
      # Outputs alone: nothing to push when every selected one is published.
      # Recipes still run, since text can change while the output stays pinned.
      - name: What to push
        id: built
        env:
          MODE: ${{ inputs.mode }}
        run: |
          any=false
          outputs=false
          if [ "$MODE" != recipes ]; then
            outputs="$(python3 -I -c 'import json, sys
          rows = json.load(open(sys.argv[1]))
          print("true" if any(r["outcome"] == "dry run" for r in rows) else "false")' "$RUNNER_TEMP/report.json")"
            any="$outputs"
            if [ "$outputs" = true ]; then
              mkdir -p handover/store
              cp -R "$RUNNER_TEMP/store/images" "$RUNNER_TEMP/store/store.toml" handover/store/
              cp "$RUNNER_TEMP/dry-run.txt" "$RUNNER_TEMP/report.json" handover/
            fi
          fi
          if [ "$MODE" != outputs ]; then
            any=true
            mkdir -p handover
            cp "$RUNNER_TEMP/recipes.txt" "$RUNNER_TEMP/recipes.json" handover/
          fi
          echo "any=$any" >> "$GITHUB_OUTPUT"
          echo "outputs=$outputs" >> "$GITHUB_OUTPUT"
          echo "to push: $any (outputs: $outputs)"

      - name: Hand the store to the push job
        if: steps.built.outputs.any == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store
          path: handover/
          # The maintainer approves the push job within this time, or re-runs.
          retention-days: 7
          if-no-files-found: error
          overwrite: true

  # Builds nothing; downloads unemu, its release's SHA256SUMS and the built
  # store: the credentials of this job never meet a build.
  push:
    name: push selected outputs and recipe artifacts
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Holds UNEMU_PROMOTE_PASSWORD; the maintainer approves each run of this
    # job; deploys from main only.
    environment: media
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python 3.11 or later
        run: |
          python3 -I -c 'import sys; sys.exit(0 if sys.version_info >= (3, 11) else
            "lib/ needs Python 3.11 or later (tomllib); this runner has " + sys.version.split()[0])'

      # Fetched and checked here again, never taken from the artifact.
      # The action checks the release archive against its SHA256SUMS,
      # then runs unemu --version and checks commit:, not our archive pins.
      - name: Install unemu
        id: unemu
        uses: unemu-org/unemu/.github/actions/setup-unemu@38408cd8669803a4fda1369ba9948e4eedc39539 # v0.0.5
        with:
          version: v0.0.5
          commit: 38408cd8669803a4fda1369ba9948e4eedc39539

      - name: Take the store of the build job
        if: needs.build.outputs.outputs == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: store
          path: handover

      # From the input, as the build job reads it, never from the build
      # job's outputs (an empty selection would mean every recipe).
      - name: Read the selection
        env:
          SELECT: ${{ inputs.select }}
          MODE: ${{ inputs.mode }}
        run: |
          case "$SELECT" in
            *[$'\n\r\t']*)
              echo "::error::the select input holds a newline, carriage return or tab; separate recipes and refs with spaces"
              exit 1
              ;;
          esac
          read -ra words < <(printf '%s\n' "$SELECT")
          # Both uses the open default in both jobs; only recipes alone may select private.
          if [ "$MODE" = both ] && [ "${#words[@]}" -eq 0 ]; then
            words=(recipes/media recipes/firmware)
          fi
          : > "$RUNNER_TEMP/selection"
          for word in ${words[@]+"${words[@]}"}; do
            printf '%s\0' "$word" >> "$RUNNER_TEMP/selection"
          done
          echo "selected: ${words[*]-} (empty: mode default)"

      # --no-build: every byte the push uploads is checked against the
      # recipe's pin and copied into a clean store of the run's own, the
      # only one unemu reads (lib/publish.py, take_from_store); unemu never
      # reads a file of the artifact, and a forged store can only fail.
      - name: Push to unemu/media/ and unemu/firmware/
        if: needs.build.outputs.outputs == 'true'
        env:
          UNEMU: ${{ steps.unemu.outputs.path }}
          UNEMU_REGISTRY_HOST: ${{ vars.UNEMU_REGISTRY_HOST }}
          UNEMU_REGISTRY_USER: ci-promote
          UNEMU_REGISTRY_PASSWORD: ${{ secrets.UNEMU_PROMOTE_PASSWORD }}
        run: |
          mapfile -d '' -t selectors < "$RUNNER_TEMP/selection"
          status=0
          python3 -I lib/publish.py --cli "$UNEMU" --skip-published --no-build \
            --store handover/store --push -- ${selectors[@]+"${selectors[@]}"} \
            > "$RUNNER_TEMP/push.txt" || status=$?
          cat "$RUNNER_TEMP/push.txt"
          {
            echo "### Push"
            echo '```'
            cat "$RUNNER_TEMP/push.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # Re-created from this checkout, never from the build artifact. Only
      # this step receives credentials; the anonymous gate runs first and
      # every successful push is pulled anonymously and compared bytewise.
      - name: Push to unemu/recipes/
        if: inputs.mode != 'outputs'
        env:
          UNEMU: ${{ steps.unemu.outputs.path }}
          UNEMU_REGISTRY_HOST: ${{ vars.UNEMU_REGISTRY_HOST }}
          UNEMU_REGISTRY_USER: ci-promote
          UNEMU_REGISTRY_PASSWORD: ${{ secrets.UNEMU_PROMOTE_PASSWORD }}
        run: |
          mapfile -d '' -t selectors < "$RUNNER_TEMP/selection"
          status=0
          python3 -I lib/publish.py --cli "$UNEMU" --recipes --push \
            --store "$RUNNER_TEMP/recipe-store" -- ${selectors[@]+"${selectors[@]}"} \
            > "$RUNNER_TEMP/recipe-push.txt" || status=$?
          cat "$RUNNER_TEMP/recipe-push.txt"
          {
            echo "### Recipe push and anonymous read-back"
            echo '```'
            cat "$RUNNER_TEMP/recipe-push.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
