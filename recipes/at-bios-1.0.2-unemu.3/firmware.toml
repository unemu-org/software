# The unemu AT BIOS 1.0.2-unemu.3, the system BIOS of unemupc's open AT
# templates, as the firmware package unemu/firmware/unemu-at-bios-1.0.2-unemu.3
# (revision 1). build.sh downloads the ROM and its source archive from the
# release assets of github.com/unemu-org/at-bios v1.0.2-unemu.3; the pins
# below are its outputs in out/at-bios-1.0.2-unemu.3/, equal to the ROM and
# the source archive unemupc's firmware catalogue pins for this id
# (crates/assembly/src/firmware.rs). The title, description, vendor, version
# and labels are unemupc's (pc_image::template::FIRMWARE), word for word, so
# the package is the one unemupc's template build makes; the digest is the
# one the pinned upcli (upcli.toml) gives it. The licence is the one the
# catalogue records for the ROM; the source archive carries it too.

[package]
catalogue_id = "unemu-at-bios-1.0.2-unemu.3"
revision = 1
digest = "sha256:7a4d34f3e6d229d0857a592daf2f6412be33aa0dc385bdd605e28cf6eac6c64e"
title = "unemu AT BIOS 1.0.2-unemu.3"
description = "The system BIOS of the open AT templates: release 1.0.2-unemu.3 of unemu-at-bios, the unemu fork of 8088_bios 1.0.2 by Sergey Kiselev, its original author. Its unemu-at build is a 32 KiB ROM at F8000h-FFFFFh for IBM 5170-class 80286 boards with two 8259s, two 8237s, an 8042 and an MC146818. Unlike upstream it resumes through the CMOS shutdown byte, answers INT 15h AH=87h and AH=88h, measures extended memory into CMOS 30h-31h, clears the memory it finds above 1 MiB on every POST and checks the CMOS as the IBM PC/AT BIOS does. It serves diskettes only; fixed disks come from an option ROM such as the XTIDE Universal BIOS. Licensed under GPL-3.0-or-later; the package includes its corresponding source archive."
vendor = "unemu (fork of Sergey Kiselev's 8088_bios)"
version = "1.0.2-unemu.3"
labels = ["open-source", "pc-at", "system-bios"]
license = "GPL-3.0-or-later"

[rom]
path = "bios-unemu-at.bin"
sha256 = "6938dc8b665fa120f33775163ab6bacc559389525db87adedf734416f9ef2442"

[source]
path = "unemu-at-bios-1.0.2-unemu.3-src.tar"
sha256 = "b928cee48fb7be8bf3da0808ed31a2ad283ae4d57e73241e59a61b1ddde932ee"
