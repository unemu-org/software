# The FreeDOS 1.4 Floppy Edition, released by the FreeDOS Project on
# 2025-04-02, in each floppy format it ships: unemu/media/freedos:1.4 (the
# edition's own 3.5-inch 1.44M disks), :1.4-1.2m (5.25-inch 1.2M) and
# :1.4-720k (3.5-inch 720K). build.sh fetches and checks the disks and builds
# the extras; the pins below are its outputs in out/freedos-1.4-floppy/, and
# each set's digest is the one the pinned upcli (upcli.toml) gives it. The
# disks are the edition's images, unmodified, in installer order; the
# descriptions and disk labels are unemupc98's (pc_image::template::MEDIA).
# The title deliberately differs from unemupc98's ("FreeDOS 1.4 (Floppy
# Edition, 1.44M)" and so on): under the maintainer's naming scheme it is the
# work's title only, "FreeDOS", while the version, the edition and the format
# go to their own fields and the tag. Do not change it back: these sets have
# their own digests, and the old titles' sets stay unemupc98's until it
# switches to these refs.
# LICENSES.TXT, the licence index (CC0-1.0), names every program, its licence
# and where its source is; the licence expression is the conjunction it
# states. The source archive holds the official FreeDOS 1.4 source packages
# of every program on the disks, the installer and the release build
# environment.

[release]
work = "freedos"
version = "1.4"
default_format = "1.44M"
edition = "Floppy Edition"
publishers = ["The FreeDOS Project"]
developers = ["The FreeDOS Project"]
year = 2025
genres = ["operating system"]
platform = "DOS"
labels = ["freedos", "open-source", "operating-system"]
license = "GPL-1.0-only AND GPL-1.0-or-later AND GPL-2.0-only AND GPL-2.0-or-later AND GPL-3.0-or-later AND LGPL-2.1-or-later AND MIT AND BSD-2-Clause AND MPL-2.0 AND Watcom-1.0 AND Info-ZIP AND Artistic-1.0 AND GFDL-1.1-or-later AND Zlib AND LicenseRef-FreeDOS-other"
terms = "LICENSES.TXT"
source = "freedos-1.4-floppy-src.tar"

[[release.extra]]
path = "LICENSES.TXT"
sha256 = "35d9478a2f5b3e54ded8d20b1b23feec10b0abd2e1e6715c77ddf314e7bf1a7f"
dos_name = "LICENSES.TXT"
kind = "document"

[[release.extra]]
path = "freedos-1.4-floppy-src.tar"
sha256 = "dfa7006e742cb9676a0a6401ce64214089923f055f4a7ba8f36960115b5362b6"
dos_name = "FD14SRC.TAR"
kind = "archive"

[[set]]
title = "FreeDOS"
description = "The official FreeDOS 1.4 Floppy Edition on seven 3.5-inch 1.44M diskettes, unmodified: the boot disk with the floppy installer, then six disks of packages in a Slicer archive. It installs FreeDOS 1.4 with a set of programs suited to classic PCs, the 80286 included, on any PC that runs FreeDOS with EGA or better graphics. Released by the FreeDOS Project on 2 April 2025. GPL and other open source licences, listed per program in LICENSES.TXT; the set carries the official FreeDOS source packages of its programs."
