# Ken's Labyrinth 2.01, the full version, by Ken Silverman, published by Epic
# MegaGames in 1993 and released by the author as freeware, with Epic
# MegaGames' permission, on 1999-11-16: unemu/media/kenslab:2.01. The
# upstream release is an archive without disks, LABFULL.ZIP from the author's
# official page (https://advsys.net/ken/klab.htm), so the set's format is the
# default 1.44M and its one diskette holds every file of the archive,
# unmodified. build.sh fetches and checks the archive and builds the outputs;
# the pins below are its outputs in out/kenslab-2.01/, and the set's digest
# is the one the pinned upcli (upcli.toml) gives it.
# The version is the one the game displays: V2.01, on its title art (the
# author's LAB21F.PNG, "from LABFULL.ZIP"). The author's page names the
# archive "Ken's Labyrinth v2.1", but the program's own display wins; no
# file of the archive states a version as text. "Full Version" is the
# edition as README.TXT states it ("the FULL version of Ken's Labyrinth"); it
# is the work's primary edition, so the tag carries no edition slug. The
# developers are those HELPME.DOC credits with programming and level design.
# The licence is the author's own terms, README.TXT, carried unmodified as the
# terms text; LICENSES.TXT, the licence index (CC0-1.0), names every file and
# its licence and the other contributors. The terms are not copyleft, so the
# set carries no source.

[release]
work = "kenslab"
version = "2.01"
default_format = "1.44M"
edition = "Full Version"
publishers = ["Epic MegaGames"]
developers = ["Ken Silverman", "Andy Cotter"]
year = 1993
genres = ["first-person shooter"]
platform = "DOS"
labels = ["game", "freeware", "first-person-shooter"]
license = "LicenseRef-KensLabyrinth-Freeware"
terms = "README.TXT"

[[release.extra]]
path = "LICENSES.TXT"
sha256 = "3db75b055776b7232bd9188abb4cfa79db49035db1091a545dded4f733671b72"
dos_name = "LICENSES.TXT"
kind = "document"

[[release.extra]]
path = "README.TXT"
sha256 = "b4a4fbf1f9ef0601bde0169fd95b649bf4d41415e5db41b6a24f5a28dda69b39"
dos_name = "README.TXT"
kind = "document"

[[set]]
title = "Ken's Labyrinth"
description = "Ken's Labyrinth 2.01, the full version of Ken Silverman's first-person shooter, published by Epic MegaGames in 1993: the aliens of the planet Zogar have taken your dog Sparky, and you go through their labyrinth in three episodes of ten levels. One 3.5-inch 1.44M diskette holds all 19 files of the author's LABFULL.ZIP, unmodified: the game (KEN.EXE); KENSBFIX.EXE, the author's 2008 build that fixes the 'Digitized Sound' crash and replaces KEN.EXE when Digitized Sound is enabled; SETUP.EXE; the game data; the manual (HELPME.DOC); the hint manual (HINTS.TXT); and four bonus saved games. Copy them to a hard disk, run SETUP, then KEN. Released by the author as freeware, with Epic MegaGames' permission, on 16 November 1999: it may be copied freely, but not sold, and only with all of its files (README.TXT, the set's licence text)."
format = "1.44M"
digest = "sha256:8a4c707d689eb0ab6a2599777c82af8229f420d5f2cc7b585fb7c840e9584481"

[[set.disk]]
path = "labfull.img"
sha256 = "393a571e5ecae64a920cb4f09109388aab6bb27ca266902f09b19fc9272a3c08"
label = "Disk 1 of 1 - the game (labfull.img)"
