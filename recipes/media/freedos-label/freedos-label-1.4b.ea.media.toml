# Official FreeDOS package; byte-identical ZIP in repository releases: 1.1.
# Input size and SHA-256 verified against unemu recipe scaffold; listing CRC checked.
# Metadata: listing.csv at each input release root and appinfo/label.lsm.
# Licence evidence, exact file/line spans and full texts: licenses.txt.
# Release normalization: 1.4b.ea -> 1.4b.ea; lowercase and non-tag runs to '-'.
# Same-version distinct ZIPs use -fd plus the repository release of first appearance.
# The file-set places the intact ZIP under an uppercase 8.3 DOS filename.
# File inputs in FAT steps await recipe 1.1, ufe-uym.9.11 (unemu); floppy bytes stay identical.
recipe = "1.0"
work = "freedos-label"

[media]
name = "unemu/media/ibm-pc/freedos-label"
platform = "ibm-pc"
release = "1.4b.ea"
revision = 1
digest = "sha256:88c2bdeb879ac7118126cbb67baa47e322c4894b3efb80b956c8778e4d7ada28"

[title]
version = "1.4b.ea"
labels = ["base"]
description = "Sets or changes a disk volume label. One 1.44M floppy holds the complete official FreeDOS package ZIP, unmodified, as LABEL.ZIP. Copy the ZIP to a hard disk or use it with FreeDOS FDINST/FDIMPLES to install. LICENSES.TXT records the licences and source-header evidence. The identical package ZIP is attached as SOURCE.ZIP with its SOURCE/ tree. Distributed under GPL-2.0-or-later."

[license]
expression = "GPL-2.0-or-later"
terms = "licenses"
source = "source"

# The source extra is the intact official package ZIP.
[input.zip]
name = "label.zip"
size = 11339
sha256 = "e867ca33416c448445371699094fe5d2d6752d6981baea0c2a8ade4f8de75467"
urls = ["https://ibiblio.org/pub/micro/pc-stuff/freedos/files/repositories/1.1/base/label.zip"]

# The same bytes under their 8.3 name for recipe 1.0's FAT operand.
[input.package]
name = "package"
files = [{ path = "LABEL.ZIP", size = 11339, sha256 = "e867ca33416c448445371699094fe5d2d6752d6981baea0c2a8ade4f8de75467" }]

# Our index prose and quoted licence documents; no program or data member bundled.
[input.licenses-lf]
name = "licenses.txt"
size = 67803
sha256 = "62b2309db4e676f4dc63c04a6f209424acbbdfa5fc55cd1e83c5c21789eb17e7"
bundle = true

# Fixed, recipe-owned FAT metadata; the package ZIP itself is unmodified.
[[step]]
id = "disk"
fat = "package"
format = "1.44M"
label = "FD-LABEL"
serial = 0x19800101
order = "listed"
time = 1980-01-01T00:00:00

[[step]]
id = "licenses"
text = "licenses-lf"
eol = "crlf"

[[medium]]
id = "disk-1"
label = "Disk 1 of 1 - label 1.4b.ea package ZIP"
format = "1.44M"
file_name = "LABEL.IMG"
from = "disk"

[[extra]]
id = "licenses"
file_name = "LICENSES.TXT"
dos_name = "LICENSES.TXT"
kind = "document"
from = "licenses"

# Exactly the same ZIP as on the floppy, with its corresponding SOURCE/ tree.
[[extra]]
id = "source"
file_name = "freedos-label-1.4b.ea-source.zip"
dos_name = "SOURCE.ZIP"
kind = "archive"
from = "zip"
