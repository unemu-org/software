# Official FreeDOS package; byte-identical ZIP in repository releases: latest.
# Input size and SHA-256 verified against unemu recipe scaffold; listing CRC checked.
# Metadata: listing.csv at each input release root and APPINFO/MEM.LSM.
# Licence evidence, exact file/line spans and full texts: licenses.txt.
# Release normalization: 1.12 -> 1.12-fdlatest; lowercase and non-tag runs to '-'.
# Same-version distinct ZIPs use -fd plus the repository release of first appearance.
# The file-set places the intact ZIP under an uppercase 8.3 DOS filename.
# File inputs in FAT steps await recipe 1.1, ufe-uym.9.11 (unemu); floppy bytes stay identical.
recipe = "1.0"
work = "freedos-mem"

[media]
name = "unemu/media/ibm-pc/freedos-mem"
platform = "ibm-pc"
release = "1.12-fdlatest"
revision = 1
digest = "sha256:39db7318b02c8b4914e9fce56b81bbea1466227c0d829e0121984b729f0ef60e"

[title]
version = "1.12"
labels = ["base"]
description = "Reports used and available DOS memory. One 1.44M floppy holds the complete official FreeDOS package ZIP, unmodified, as MEM.ZIP. Copy the ZIP to a hard disk or use it with FreeDOS FDINST/FDIMPLES to install. LICENSES.TXT records the licences and source-header evidence. The identical package ZIP is attached as SOURCE.ZIP with its SOURCE/ tree. Distributed under GPL-2.0-only AND GPL-2.0-or-later AND LGPL-2.1-or-later."

[license]
expression = "GPL-2.0-only AND GPL-2.0-or-later AND LGPL-2.1-or-later"
terms = "licenses"
source = "source"

# The source extra is the intact official package ZIP.
[input.zip]
name = "mem.zip"
size = 145272
sha256 = "e7829f62be4fc35c668aa023931e77701f3b4112493894cdc15aae91db8f672f"
urls = ["https://ibiblio.org/pub/micro/pc-stuff/freedos/files/repositories/latest/base/mem.zip"]

# The same bytes under their 8.3 name for recipe 1.0's FAT operand.
[input.package]
name = "package"
files = [{ path = "MEM.ZIP", size = 145272, sha256 = "e7829f62be4fc35c668aa023931e77701f3b4112493894cdc15aae91db8f672f" }]

# Our index prose and quoted licence documents; no program or data member bundled.
[input.licenses-lf]
name = "licenses.txt"
size = 77476
sha256 = "df1435411c0f440cbbd200970ce16175b4c9e4997b1560021ee5cdec18bca7e1"
bundle = true

# Fixed, recipe-owned FAT metadata; the package ZIP itself is unmodified.
[[step]]
id = "disk"
fat = "package"
format = "1.44M"
label = "FD-MEM"
serial = 0x19800101
order = "listed"
time = 1980-01-01T00:00:00

[[step]]
id = "licenses"
text = "licenses-lf"
eol = "crlf"

[[medium]]
id = "disk-1"
label = "Disk 1 of 1 - mem 1.12 package ZIP"
format = "1.44M"
file_name = "MEM.IMG"
from = "disk"

[[extra]]
id = "licenses"
file_name = "LICENSES.TXT"
dos_name = "LICENSES.TXT"
kind = "document"
from = "licenses"

# Exactly the same ZIP as on the floppy, with its corresponding SOURCE/ tree.
[[extra]]
id = "source"
file_name = "freedos-mem-1.12-fdlatest-source.zip"
dos_name = "SOURCE.ZIP"
kind = "archive"
from = "zip"
