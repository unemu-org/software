# Private description only: six user-supplied disks, used byte for byte.
# MEASURED: the previous CLI (0.0.3) recipe scaffold supplied the input names, sizes
# and SHA-256s below; ids alone were renamed. 1474560 bytes maps to 1.44M.
# READ: Windows 3.1: https://www.wikidata.org/wiki/Q495432
# (retrieved 2026-11-20), consistent with the TOSEC-style version hint.
# Disk order follows the TOSEC-style (Disk N) name hints, not file contents.
# Scaffold treats raw images as plain inputs and supplies no volume labels;
# the medium labels are our neutral Disk N of 6 labels.
# IBM in the supplied names is not verified OEM provenance: no edition is
# asserted. The release is the version alone (decision-38); 1.44M is this
# supplied release's own format, with no format suffix. This is a correction
# of an unpublished description; revision remains 1.
# No TOSEC ids are asserted: the catalogue set name is not established.
# Requirements, needs, release year and publisher are omitted: no public
# source for this particular release is asserted. No text is taken from
# the title's files.

