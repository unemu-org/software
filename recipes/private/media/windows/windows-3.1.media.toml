# Private description only: six user-supplied disks, used byte for byte.
# MEASURED: each input's size and SHA-256; FAT12 geometry is 1.44M.
# READ: disk 1 SETUP.INF [disks] lists disks 1 through 6 in that order;
# all six DISKn marker files and root volume labels WIN31DISK1 through
# WIN31DISK6 are present. Its file references resolve on the named disks
# (including compressed names; the extensionless WINVER is WINVER._).
# READ: SETUP.INF [dialog] names Windows 3.1. Wikidata's version item is
# https://www.wikidata.org/wiki/Q495432 (retrieved 2026-11-20).
# READ: requirements quotes disk 1 WIN.CNF's DOS diagnostic verbatim,
# decoded in memory from WIN.CN_. README.WRI (disk 3 README.WR_) and
# disk 1 SETUP.TXT provide troubleshooting, not baseline hardware needs;
# no hardware requirements are inferred from their conditional advice.
# The release uses the software's version alone (decision-38). IBM in the
# supplied names is not verified OEM provenance, so no edition token or
# edition metadata is asserted. 1.44M is the supplied release's own
# format, with no format suffix. Publisher and release year are omitted.
# Input names are TOSEC-style hints, never identities. No TOSEC ids are
# asserted: the catalogue set name has not been established.

