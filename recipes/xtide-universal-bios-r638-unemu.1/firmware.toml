# The XTIDE Universal BIOS r638 XT+ build for 16-bit ATA at 1F0h, the
# fixed-disk option ROM of unemupc's open AT templates, as the firmware
# package unemu/firmware/xub-r638-xtp-ata1f0 (revision 1). build.sh downloads
# the ROM and its source archive from the release assets of
# github.com/unemu-org/xtide-universal-bios r638-unemu.1, whose release
# workflow configures, pads and checksums the ROM; the pins below are its
# outputs in out/xtide-universal-bios-r638-unemu.1/, equal to the ROM and the
# source archive unemupc's firmware catalogue pins for this id
# (crates/assembly/src/firmware.rs). The title, description, vendor, version
# and labels are unemupc's (pc_image::template::FIRMWARE), word for word, so
# the package is the one unemupc's template build makes; the description
# states the configuration, padding and checksum. The digest is the one the
# pinned upcli (upcli.toml) gives it. The licence is the one the catalogue
# records for the ROM; the source archive carries it too.

[package]
catalogue_id = "xub-r638-xtp-ata1f0"
revision = 1
digest = "sha256:240d2d4f9ac64382cca85e53a174c6ea3b327867a6589d8222b63744f68789ec"
title = "XTIDE Universal BIOS r638, XT+ build for ATA at 1F0h"
description = "The fixed-disk option ROM of the open AT templates: the XTIDE Universal BIOS r638 XT+ build (ide_xtp.bin) with its first controller set to 16-bit ATA at 1F0h (control block 3F0h), polled without an IRQ, and diskette A: as the boot drive; every other setting keeps its upstream default. The download is padded with zeros to its declared 8 KiB and its last byte makes the byte sum zero. It serves IBM 5170-class boards with a primary ATA channel, suggested at C8000h, on an 80186 or later. Licensed under GPL-2.0-only, as the project's binary download statement says; the package includes its corresponding source archive, the r638 Subversion trunk."
vendor = "XTIDE Universal BIOS project"
version = "r638"
labels = ["ata", "open-source", "option-rom", "pc-at"]
license = "GPL-2.0-only"

[rom]
path = "ide_xtp-r638-ata1f0-8k.bin"
sha256 = "54975501e6887c836b8d57e7aad78421e745a9b71e250f94d5d1f9631eab1513"

[source]
path = "xtide-universal-bios-r638-src.tar"
sha256 = "7bbd5de269f4e1d52ae30b52531fcda842709b9ae49166ac249f9b37187b91e8"
