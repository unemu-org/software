# An example manifest for the tests (tests/recipe-selftest.sh and
# tests/manifest_test.py). It is no real release and nothing is ever
# published from it. Its outputs are the files the self-test builds from its
# own fixtures, and its pins are theirs: a change in the bytes the helpers
# write shows up as a mismatch. Its sets would be unemu/media/example:1.0
# (the release's own 1.44M format) and unemu/media/example:1.0-720k.

[release]
work = "example"
version = "1.0"
default_format = "1.44M"
edition = "Self-test Edition"
series = "Example Series"
sort_title = "Example"
publishers = ["Example Publisher"]
developers = ["Example Developer"]
year = 1993
genres = ["utility"]
platform = "DOS"
labels = ["utility", "open-source", "self-test"]
license = "GPL-2.0-or-later"
terms = "LICENSE.TXT"
source = "example-src.tar"

[[release.extra]]
path = "LICENSE.TXT"
sha256 = "62cd3ab8fbc7b434392a6ec193a38068424d59473cc2478f59328271578ca249"
dos_name = "LICENSE.TXT"
kind = "document"

[[release.extra]]
path = "example-src.tar"
sha256 = "77ee30e50839eb339ccedf6b9a09da5f3c4f0f376a5314c65e5b0c3c1fecefc2"
dos_name = "EXSRC.TAR"
kind = "archive"

[[set]]
title = "Example"
description = "A test fixture, not a release: one 3.5-inch 1.44M diskette holding the five files of the self-test's example archive, built by tests/recipe-selftest.sh."
format = "1.44M"

[[set.disk]]
path = "example-1440.img"
sha256 = "eb2eb2da5dec2abe5722a25b724194b1f30266df9fa3ebd6b31f820b4fb3ee32"
label = "Disk 1 of 1 - example installation (example-1440.img)"

[[set]]
title = "Example"
description = "A test fixture, not a release: one 3.5-inch 720K diskette holding the five files of the self-test's example archive, built by tests/recipe-selftest.sh."
format = "720K"

[[set.disk]]
path = "example-720.img"
sha256 = "88cbd8b8454d549c17c4af14a26ce5acddf06106a5c3b875fa31704839a363d2"
label = "Disk 1 of 1 - example installation (example-720.img)"
