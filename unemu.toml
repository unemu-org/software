# The unemu release whose CLI, unemu, checks, pins, builds and pushes the
# recipes' media sets and firmware packages (lib/publish.py, lib/recipes.py;
# see docs/publishing.md). Recipes retain their original digests and locks;
# moving this CLI pin is checked by building every recipe against its lock
# again (unemu recipe conformance).
#
# commit   the commit the release's tag points to, in full. A release build
#          of unemu names it on the line `commit: <commit>` of `unemu
#          --version`; lib/publish.py and lib/unemu.py refuse an unemu that
#          names another commit, or none.
# tag      the release's tag; its assets are downloaded from
#          https://github.com/unemu-org/unemu/releases/download/<tag>/
# version  the release's version, as its archive names spell it.
#
# CI uses upstream setup-unemu pinned to this commit, with its version
# input equal to tag and its commit input equal to commit. It checks the
# archive against the release's SHA256SUMS
# and unemu --version's commit: line, not against our archive pins (the
# maintainer's decision of 2026-11-23). Update the three workflows together
# with this file; tests/changed_test.py enforces their agreement.
#
# [archive.<target triple>]: for local use, the release archive of one
# platform and the unemu inside it. lib/unemu.py checks both against these
# pins, our own, never against the release's SHA256SUMS:
#   file          unemu-<version>-<triple>.tar.gz
#   sha256        the archive's SHA-256
#   size          the archive's size in bytes
#   unemu_sha256  the SHA-256 of its member unemu-<version>-<triple>/unemu
#   unemu_size    that member's size in bytes
#
# The keys are exactly these: lib/unemu.py refuses any other, and a missing
# or malformed one.

