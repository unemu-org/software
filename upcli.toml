# The unemupc release whose CLI, upcli, imports and pushes the media sets and
# the firmware packages (lib/publish.py; see docs/publishing.md). The digest
# pins in the manifests, of every set (media.toml) and every package
# (firmware.toml), are what this CLI gives; moving this pin is checked by
# those pins.
#
# commit   the commit the release's tag points to, in full. A release build
#          of upcli names it on the line `commit: <commit>` of `upcli
#          --version`; lib/publish.py and lib/upcli.py refuse a upcli that
#          names another commit, or none.
# tag      the release's tag; its assets are downloaded from
#          https://github.com/unemu-org/unemupc/releases/download/<tag>/
# version  the release's version, as its archive names spell it.
#
# [archive.<target triple>]: the release archive of one platform, and the
# upcli inside it. lib/upcli.py checks both against these pins, our own,
# never against the release's SHA256SUMS:
#   file          unemupc-<version>-<triple>.tar.gz
#   sha256        the archive's SHA-256
#   size          the archive's size in bytes
#   upcli_sha256  the SHA-256 of its member unemupc-<version>-<triple>/upcli
#   upcli_size    that member's size in bytes
#
# The keys are exactly these: lib/upcli.py refuses any other, and a missing
# or malformed one.

commit = "87244b497749eca8a8cb3b8d09b66aaa9b015c25"
tag = "v0.0.2"
